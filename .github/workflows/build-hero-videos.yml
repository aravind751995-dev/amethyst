name: Build local stock media

on:
  push:
    paths:
      - '.github/workflows/build-hero-videos.yml'
      - 'assets/media-sources/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download stock videos and images
        shell: bash
        run: |
          set -e
          mkdir -p assets/videos assets/images assets/media-sources

          # Stock video sources — Pixabay/Pexels free-use media.
          curl -L --fail --retry 6 --retry-delay 5 --retry-all-errors -A 'Mozilla/5.0 AmethystMediaBot/1.0' -o assets/videos/home-hero.mp4 'https://videos.pexels.com/video-files/35503528/15040489_1920_1080_30fps.mp4'
          curl -L --fail -o assets/videos/tours-hero.mp4 'https://cdn.pixabay.com/video/2026/04/15/346494_large.mp4'
          curl -L --fail -o assets/videos/yatras-hero.mp4 'https://cdn.pixabay.com/video/2015/08/13/442-136215984_large.mp4'
          curl -L --fail -o assets/videos/retreats-hero.mp4 'https://cdn.pixabay.com/video/2022/03/11/110108_large.mp4'
          curl -L --fail -o assets/videos/surprises-hero.mp4 'https://cdn.pixabay.com/video/2023/01/15/146578_large.mp4'

          # Local copies of all destination, rental and experience images used by the site.
          download() { curl -L --fail --retry 6 --retry-delay 5 --retry-all-errors -A 'Mozilla/5.0 AmethystMediaBot/1.0' -o "$2" "$1"; }
          download 'https://images.pexels.com/photos/34079316/pexels-photo-34079316.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/chennai.jpg
          download 'https://images.pexels.com/photos/1337715/pexels-photo-1337715.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/nature.jpg
          download 'https://images.pexels.com/photos/5076317/pexels-photo-5076317.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/travel.jpg
          download 'https://images.pexels.com/photos/18823969/pexels-photo-18823969.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/celebration.jpg
          download 'https://images.pexels.com/photos/17788657/pexels-photo-17788657.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/retreat.jpg
          download 'https://images.pexels.com/photos/21005752/pexels-photo-21005752.jpeg?auto=compress&cs=tinysrgb&w=2200' assets/images/hero-travel.jpg
          download 'https://images.pexels.com/photos/36114768/pexels-photo-36114768.jpeg?auto=compress&cs=tinysrgb&w=1600' assets/images/experience.jpg
          download 'https://images.pexels.com/photos/37572680/pexels-photo-37572680.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/surprise-1.jpg
          download 'https://images.pexels.com/photos/17746293/pexels-photo-17746293.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/surprise-2.jpg
          download 'https://images.pexels.com/photos/6315289/pexels-photo-6315289.jpeg?auto=compress&cs=tinysrgb&w=1800' assets/images/surprise-3.jpg
          download 'https://www.forcemotors.com/wp-content/uploads/2025/02/Traveller-Wider-Body-SWB-12D13D-Banner_1.webp' assets/images/force-traveller.webp
          download 'https://www.forcemotors.com/wp-content/uploads/2026/07/urbania-menu.png.webp' assets/images/force-urbania.webp
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Courtallam%20Waterfalls.jpg' assets/images/courtallam.jpg
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Thiruvannamalai%20temple%20Tamilnadu.jpg' assets/images/thiruvannamalai.jpg
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Siruvapuri%20Sri%20Murugan%20Temple.jpg' assets/images/siruvapuri.jpg
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Jawadhu%20Hills%2C%20Tamil%20Nadu.JPG' assets/images/jawadhu.jpg
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ekambareswarar%20temple%20kanchipuram.jpg' assets/images/kanchipuram.jpg
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Thiruthani%20Murugan%20Temple.jpg' assets/images/thiruthani.jpg
          download 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Palani%20Murugan%20Hill%20Temple.jpg' assets/images/palani.jpg
          download 'https://i.ytimg.com/vi/vtWHTWD5U0w/maxresdefault.jpg' assets/images/aare.jpg
          download 'https://i.ytimg.com/vi/QCfAdUp0h1U/maxresdefault.jpg' assets/images/moola-kona.jpg

          # Normalize the hero videos for browser playback and a consistent 16:9 presentation.
          normalize() {
            local src="$1"
            local tmp="$2"
            ffmpeg -y -i "$src" -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" -an -c:v libx264 -crf 24 -preset medium -movflags +faststart "$tmp"
            mv "$tmp" "$src"
          }
      - name: Save media manifest
        run: |
          cat > assets/media-sources/README.md <<'EOF'
          # Amethyst local media

          Hero videos and destination images are downloaded into this directory by GitHub Actions from free-stock sources.

          Videos:
          - Home: Pexels Chennai aerial footage
          - Tours: Pixabay AI-generated waterfall footage
          - Yatras: Pixabay India temple journey footage
          - Retreats: Pixabay Sikkim monsoon road-trip footage
          - Surprises: Pixabay AI-generated birthday/celebration footage

          Images:
          - Chennai, nature, travel, celebration and retreat imagery from Pexels

          The site serves the resulting files from the repository itself, so visitors do not load YouTube embeds or third-party video players.
          EOF
      - name: Commit local media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos assets/images assets/media-sources/README.md
          git diff --cached --quiet && exit 0
          git commit -m "Add self-hosted stock hero videos and destination images [skip ci]"
          git pull --rebase origin main
          git push
